spring:
  application:
    name: memphisreo-platform

  # Застосунок ходить НЕ власником таблиць і без BYPASSRLS — інакше RLS не
  # діє. Міграції — окремим логіном власника (flyway.user нижче). ADR-001.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memphisreo}
    username: ${DB_USERNAME:memphisreo_app_user}
    password: ${DB_PASSWORD:memphisreo_app}

  jpa:
    # Без цього Hibernate Session відкривається на весь HTTP-запит ще до
    # того, як наш код встигне виставити TenantContext (напр. у
    # TenantRegistrationService) — tenant сесії "заморожується" на значенні,
    # резолвленому на момент відкриття. Сесія (і транзакція з SET LOCAL
    # app.tenant_id) має відкриватись уже під потрібним tenant-ом.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Tenant-сутності без явної схеми живуть в app; control_plane/search
        # вказані на сутностях явно.
        default_schema: app

  # Одна послідовність міграцій на комірку — ADR-001. Виконується логіном
  # власника таблиць, не логіном застосунку.
  flyway:
    user: ${DB_OWNER_USERNAME:memphisreo}
    password: ${DB_OWNER_PASSWORD:memphisreo}
    schemas: control_plane,app,search
    default-schema: control_plane
    locations: classpath:db/migration
    placeholder-replacement: false  # не використовуємо ${...}; уникає false-positive на JSON-контенті в міграціях

  # Локально — Mailpit з docker compose (веб-інтерфейс http://localhost:8025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

  servlet:
    multipart:
      # Верхня межа запиту; ліміти за типом (фото 20 МБ, відео 200 МБ) — у MediaService.
      max-file-size: 210MB
      max-request-size: 211MB

# Секрети нижче — placeholder-и для локальної розробки, НЕ для прод.
# Прод: base64-рядок з >=32 байтами ентропії з секрет-менеджера, окремий
# ключ на tenant-realm і platform-realm — docs/security.md §6.
memphisreo:
  # Ідентифікатор комірки (cell), яку обслуговує цей інстанс — ADR-001.
  cell: ${MEMPHISREO_CELL:local-1}
  # Звідки фронт: посилання в листах (скидання пароля тощо).
  web-base-url: ${MEMPHISREO_WEB_BASE_URL:http://localhost:5173}
  # Публічна адреса API (iCal-підписка, яку додають у зовнішні календарі).
  api-base-url: ${MEMPHISREO_API_BASE_URL:http://localhost:8080}
  mail:
    from: ${MEMPHISREO_MAIL_FROM:Memphis <no-reply@memphisreo.local>}
  # Геокодування для форми об'єкта (проксі через бекенд). Публічний Photon — лише для розробки.
  geo:
    photon-url: ${MEMPHISREO_PHOTON_URL:https://photon.komoot.io}
    user-agent: ${MEMPHISREO_GEO_USER_AGENT:Memphis/0.1 (real-estate CRM; dev)}
  # Демо-агенція "Одеса Рієлт" з об'єктами, фото й клієнтами — лише для розробки/демо.
  demo-seed:
    enabled: ${MEMPHISREO_DEMO_SEED:false}
  # Перший супер-адмін платформи — створюється на старті, якщо його ще немає.
  # Без дефолтів: локально значення дає dev.sh (.env.local), у проді — секрети.
  bootstrap-admin:
    email: ${MEMPHISREO_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${MEMPHISREO_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    tenant-jwt-secret: ${TENANT_JWT_SECRET:ZGV2LW9ubHktdGVuYW50LXNlY3JldC1jaGFuZ2UtbWUtMzJieXRlcyE=}
    platform-jwt-secret: ${PLATFORM_JWT_SECRET:ZGV2LW9ubHktcGxhdGZvcm0tc2VjcmV0LWNoYW5nZS1tZS0zMmJ5dGVzIQ==}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:memphisreo}
    secret-key: ${STORAGE_SECRET_KEY:memphisreo123}
    region: us-east-1
    # Один приватний бакет; ізоляція агенцій — префікс ключа tenants/<tenant_id>/.
    bucket: ${STORAGE_BUCKET:memphisreo-files}
    # Endpoint у підписаних посиланнях для браузера (якщо відрізняється від внутрішнього).
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${memphisreo.storage.endpoint}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
