services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: memphisreo-postgres
    environment:
      POSTGRES_DB: memphisreo
      POSTGRES_USER: memphisreo
      POSTGRES_PASSWORD: memphisreo
    ports:
      - "5432:5432"
    volumes:
      - memphisreo_pgdata:/var/lib/postgresql/data
      # Логін застосунку (не власник таблиць) — виконується лише при першій ініціалізації тому.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memphisreo -d memphisreo"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: memphisreo-minio
    environment:
      MINIO_ROOT_USER: memphisreo
      MINIO_ROOT_PASSWORD: memphisreo123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - memphisreo_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memphisreo_pgdata:
  memphisreo_minio:
