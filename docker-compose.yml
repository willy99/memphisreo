services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: memphisreo-postgres
    environment:
      POSTGRES_DB: memphisreo
      POSTGRES_USER: memphisreo
      POSTGRES_PASSWORD: memphisreo
    ports:
      - "5432:5432"
    volumes:
      - memphisreo_pgdata:/var/lib/postgresql/data
      # Логін застосунку (не власник таблиць) — лише при першій ініціалізації тому.
      # Монтується ОДИН файл, не каталог: каталог затер би власний init-скрипт
      # образу postgis (10_postgis.sh).
      - ./docker/postgres/init/01-app-login.sql:/docker-entrypoint-initdb.d/01-app-login.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memphisreo -d memphisreo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-сумісне сховище для локальної розробки. MinIO прибрав свої образи
  # з Docker Hub/quay.io (2025) — RustFS: той самий S3 API, ті самі порти.
  # Код працює через ObjectStorage + AWS SDK, тож це заміна лише інфраструктури.
  s3:
    image: rustfs/rustfs:1.0.1
    container_name: memphisreo-s3
    environment:
      RUSTFS_ACCESS_KEY: memphisreo
      RUSTFS_SECRET_KEY: memphisreo123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console: http://localhost:9001/rustfs/console/
    volumes:
      - memphisreo_s3:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memphisreo_pgdata:
  memphisreo_s3:
